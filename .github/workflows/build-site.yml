name: Build & Validate Static Site

on:
  push:
    branches:
      - main
    paths:
      - 'experiences/**'
      - 'taxonomy.md'
      - 'scripts/**'
  pull_request:
    branches:
      - main
    paths:
      - 'experiences/**'
      - 'taxonomy.md'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Strict Validation & Build Static Site
        run: node scripts/build-site.js
